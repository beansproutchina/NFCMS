version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nfcms-backend
    ports:
      - "54330:3000"
    environment:
      - NODE_ENV=production
      - BUN_ENV=production
    volumes:
      # 仅挂载业务必需的目录
      - ./backend/data:/app/backend/data
      - ./backend/static:/app/backend/static
      - ./upload:/app/backend/upload
    restart: always
    networks:
      - nfcms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 前端服务（Nginx）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 选择主题: pear 或 school
        THEME: pear
    container_name: nfcms-frontend
    ports:
      - "54380:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - nfcms-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  nfcms-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
  backend-uploads:
    driver: local
