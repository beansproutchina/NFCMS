user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               text/x-component text/x-cross-domain-policy;

    # 预渲染产物的 root。带 `X-SSG-Bypass: 1` 的请求指向一个不存在的目录,于是所有 try_files
    # 全部落空、回落 SPA —— 生成器靠它避免快照到自己上一轮的快照(否则内容永远停在第一次)。
    #
    # 用 map 而不是 `if`:nginx 的 `if` in location 是著名的坑(rewrite 阶段语义与直觉不符)。
    map $http_x_ssg_bypass $ssg_root {
        default  /app/backend/static/ssg;
        "1"      /var/empty/ssg-bypass;
    }

    server {
        listen 80;
        server_name _;

        # 命中顺序:真实静态资源 → 预渲染页 → SPA 壳。
        #
        # 注意这里**没有任何排除列表**:`/admin`、`/login`、`/setup` 之所以永远走 SPA,是因为
        # 预渲染器从不写这些文件 —— 只写允许的文件,就没有别的东西能被静态命中。少一份需要
        # 手工维护、且漏一条就出事的名单。
        location = / {
            root $ssg_root;
            try_files /index.html @spa;
        }
        location = /sitemap.xml {
            root $ssg_root;
            try_files /sitemap.xml =404;
        }
        location / {
            root /usr/share/nginx/html;
            # 先让真实文件命中(/assets/*.js、/favicon.svg);目录形态的请求不在这里兜底,
            # 交给 @ssg → @spa,否则 dist/index.html 会抢在预渲染页前面。
            try_files $uri @ssg;
        }
        location @ssg {
            root $ssg_root;
            try_files $uri.html @spa;
        }
        location @spa {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_redirect off;
        }

        location /static/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            expires 30d;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
