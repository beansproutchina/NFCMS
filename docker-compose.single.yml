services:
  nfcms:
    build:
      context: .
      dockerfile: Dockerfile.single
      args:
        THEME: school
    image: nfcms-allinone:latest
    container_name: nfcms-allinone
    ports:
      - "54380:80"
    environment:
      - NODE_ENV=production
      - BUN_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=nfcms
      - MYSQL_PASSWORD=PYX2KdkMM6pXGh5X
      - MYSQL_DATABASE=nfcms
    volumes:
      - ./backend/data:/app/backend/app/data
      - ./backend/static:/app/backend/app/static
      - ./upload:/app/backend/app/upload
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
