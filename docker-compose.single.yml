services:
  nfcms:
    build:
      context: .
      dockerfile: Dockerfile.single
      args:
        THEME: pear
    image: nfcms-allinone:latest
    container_name: nfcms-allinone
    ports:
      - "54380:80"
    environment:
      - NODE_ENV=production
      - BUN_ENV=production
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/static:/app/backend/static
      - ./upload:/app/backend/upload
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
